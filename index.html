<!DOCTYPE html>
<html>
<head>
    <title>Happy Birthday 🎂</title>
    <style>
        body {
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            text-align: center;
            font-family: Arial;
            color: white;
            padding: 30px;
        }

        .box {
            background: rgba(255,255,255,0.2);
            padding: 25px;
            border-radius: 25px;
            margin-top: 50px;
        }

        img {
            width: 90%;
            max-width: 300px;
            border-radius: 20px;
        }

        button {
            padding: 15px 25px;
            border: none;
            border-radius: 25px;
            background: white;
            color: #ff5f7e;
            font-size: 18px;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>🎂 Happy Birthday! 🎉</h1>

    <h2>Hey Bestie ❤️</h2>

    <img src="photo.jpg" alt="Birthay Memory">

    <p>
        Another year older... but don't worry,
        you're still my favourite idiot 😂❤️
    </p>

    <button onclick="alert('You are the best person i have ever meet. Thanks for accepting my follow request even you have a big fan following 😂❤️')">
        Click for a Surprise 🎁
    </button>

</div>

</body>
</html>
